<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baldi-chens 官网</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=Comic+Neue:wght@400;700&display=swap">
<style>
  :root {
    --paper: #fbf7ee;
    --ink: #2a2622;
    --ink-soft: #5c564e;
    --green: #2f7d4d;
    --green-deep: #225c38;
    --yellow: #f6c325;
    --red: #e5484d;
    --board: #23413a;
    --line: #e4dbc8;
    --shadow: 0 10px 30px rgba(42, 38, 34, .14);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Comic Neue", "Comic Sans MS", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 8%, rgba(246, 195, 37, .12), transparent 26%),
      radial-gradient(circle at 88% 20%, rgba(61, 127, 191, .10), transparent 28%),
      var(--paper);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px clamp(16px, 4vw, 40px);
    background: rgba(251, 247, 238, .92);
    backdrop-filter: blur(8px);
    border-bottom: 2px solid var(--line);
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    font-family: "Comic Neue", "Comic Sans MS", "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
    font-size: 22px;
    letter-spacing: .5px;
    color: var(--green-deep);
    padding: 6px 0;
  }
  .brand .star { width: 30px; height: 30px; flex: none; }
  .nav { display: flex; align-items: center; gap: 4px; }
  .nav a {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 8px 16px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
    border-radius: 12px;
    transition: background .2s ease, color .2s ease;
  }
  .nav a:hover { background: rgba(47, 125, 77, .10); color: var(--green-deep); }
  .nav a::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 6px;
    width: 0;
    height: 3px;
    border-radius: 3px;
    background: var(--yellow);
    transform: translateX(-50%);
    transition: width .22s ease;
  }
  .nav a:hover::after { width: 42%; }
  .hero {
    padding: clamp(32px, 7vw, 80px) clamp(16px, 4vw, 40px) clamp(40px, 7vw, 80px);
    text-align: center;
  }
  .hero .eyebrow {
    display: inline-block;
    margin: 0 0 14px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--red);
  }
  .hero h1 {
    margin: 0 0 8px;
    font-family: "Comic Neue", "Comic Sans MS", "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
    font-size: clamp(34px, 7vw, 60px);
    font-weight: 400;
    line-height: 1.2;
    color: var(--green-deep);
  }
  .hero .sub {
    max-width: 560px;
    margin: 0 auto clamp(28px, 5vw, 44px);
    color: var(--ink-soft);
    font-size: 16px;
  }
  .photo {
    position: relative;
    display: inline-block;
    max-width: 900px;
    width: 100%;
    transform: rotate(-1.2deg);
    transition: transform .35s ease;
  }
  .photo:hover { transform: rotate(0deg) translateY(-4px); }
  .photo img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: var(--radius);
    border: 4px solid #fff;
    box-shadow: var(--shadow);
    background: #fff;
  }
  .photo::after {
    content: "";
    position: absolute;
    right: -10px;
    top: -10px;
    width: 60px;
    height: 60px;
    background: radial-gradient(circle at 50% 50%, var(--yellow) 26%, transparent 30%);
    opacity: .9;
  }
  section {
    max-width: 980px;
    margin: 0 auto;
    padding: clamp(40px, 6vw, 72px) clamp(16px, 4vw, 40px);
  }
  footer {
    margin-top: 40px;
    background: var(--board);
    color: #f3efe3;
    text-align: center;
    padding: clamp(30px, 5vw, 52px) 20px;
    border-radius: 28px 28px 0 0;
  }
  footer .chalk {
    font-family: "Comic Neue", "Comic Sans MS", "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
    font-size: clamp(22px, 4vw, 30px);
    margin: 0 0 8px;
    color: #fff;
  }
  footer p { margin: 0; font-size: 14px; color: rgba(243, 239, 227, .8); }
  @media (prefers-reduced-motion: no-preference) {
    .photo { animation: pop-in .7s ease both; }
    @keyframes pop-in {
      from { opacity: 0; transform: rotate(-4deg) scale(.96); }
      to { opacity: 1; transform: rotate(-1.2deg) scale(1); }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .photo { transform: none; }
  }
  @media (max-width: 640px) {
    .brand { font-size: 18px; }
    .brand .star { width: 26px; height: 26px; }
    .nav a { padding: 8px 10px; font-size: 15px; }
  }
</style>

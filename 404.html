<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=Comic+Neue:wght@400;700&display=swap">
<style>
  :root {
    --paper: #fbf7ee;
    --ink: #2a2622;
    --ink-soft: #5c564e;
    --green: #2f7d4d;
    --green-deep: #225c38;
    --yellow: #f6c325;
    --red: #e5484d;
    --board: #23413a;
    --line: #e4dbc8;
    --shadow: 0 10px 30px rgba(42, 38, 34, .14);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Comic Neue", "Comic Sans MS", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 8%, rgba(246, 195, 37, .12), transparent 26%),
      radial-gradient(circle at 88% 20%, rgba(61, 127, 191, .10), transparent 28%),
      var(--paper);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px clamp(16px, 4vw, 40px);
    background: rgba(251, 247, 238, .92);
    backdrop-filter: blur(8px);
    border-bottom: 2px solid var(--line);
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    font-family: "Comic Neue", "Comic Sans MS", "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
    font-size: 22px;
    letter-spacing: .5px;
    color: var(--green-deep);
    padding: 6px 0;
  }
  .brand .star { width: 30px; height: 30px; flex: none; }
  .nav { display: flex; align-items: center; gap: 4px; }
  .nav a {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 8px 16px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
    border-radius: 12px;
    transition: background .2s ease, color .2s ease;
  }
  .nav a:hover { background: rgba(47, 125, 77, .10); color: var(--green-deep); }
  .nav a::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 6px;
    width: 0;
    height: 3px;
    border-radius: 3px;
    background: var(--yellow);
    transform: translateX(-50%);
    transition: width .22s ease;
  }
  .nav a:hover::after { width: 42%; }
  .error {
    text-align: center;
    padding: clamp(40px, 8vw, 100px) clamp(16px, 4vw, 40px);
    max-width: 720px;
    margin: 0 auto;
  }
  .error-svg {
    display: block;
    margin: 0 auto 24px;
    max-width: 420px;
    width: 100%;
    height: auto;
    border-radius: var(--radius);
    border: 4px solid #fff;
    box-shadow: var(--shadow);
    background: #fff;
  }
  .error h1 {
    margin: 0 0 12px;
    font-family: "Comic Neue", "Comic Sans MS", "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
    font-size: clamp(32px, 6vw, 52px);
    color: var(--red);
  }
  .error p {
    margin: 0;
    font-size: 16px;
    color: var(--ink-soft);
    line-height: 1.8;
  }
  footer {
    margin-top: 40px;
    background: var(--board);
    color: #f3efe3;
    text-align: center;
    padding: clamp(30px, 5vw, 52px) 20px;
    border-radius: 28px 28px 0 0;
  }
  footer .chalk {
    font-family: "Comic Neue", "Comic Sans MS", "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
    font-size: clamp(22px, 4vw, 30px);
    margin: 0 0 8px;
    color: #fff;
  }
  footer p { margin: 0; font-size: 14px; color: rgba(243, 239, 227, .8); }
  @media (max-width: 640px) {
    .brand { font-size: 18px; }
    .brand .star { width: 26px; height: 26px; }
    .nav a { padding: 8px 10px; font-size: 15px; }
  }
</style>

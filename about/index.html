<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>了解 Baldi-chens Game</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=Comic+Neue:wght@400;700&display=swap">
<style>
  /* ===== 设计令牌（与主页/游戏库一致） ===== */
  :root {
    --paper: #fbf7ee;
    --ink: #2a2622;
    --ink-soft: #5c564e;
    --green: #2f7d4d;
    --green-deep: #225c38;
    --yellow: #f6c325;
    --red: #e5484d;
    --board: #23413a;
    --line: #e4dbc8;
    --shadow: 0 10px 30px rgba(42, 38, 34, .14);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Comic Neue", "Comic Sans MS", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 8%, rgba(246, 195, 37, .12), transparent 26%),
      radial-gradient(circle at 88% 20%, rgba(61, 127, 191, .10), transparent 28%),
      var(--paper);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  /* ===== 顶部导航条（与游戏库一致） ===== */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px clamp(16px, 4vw, 40px);
    background: rgba(251, 247, 238, .92);
    backdrop-filter: blur(8px);
    border-bottom: 2px solid var(--line);
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    font-family: "Comic Neue", "Comic Sans MS", "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
    font-size: 22px;
    letter-spacing: .5px;
    color: var(--green-deep);
    padding: 6px 0;
  }
  .brand .star { width: 30px; height: 30px; flex: none; }
  .nav { display: flex; align-items: center; gap: 4px; }
  .nav a {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 8px 16px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
    border-radius: 12px;
    transition: background .2s ease, color .2s ease;
  }
  .nav a:hover { background: rgba(47, 125, 77, .10); color: var(--green-deep); }
  .nav a.active { background: rgba(47, 125, 77, .10); color: var(--green-deep); }
  .nav a::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 6px;
    width: 0;
    height: 3px;
    border-radius: 3px;
    background: var(--yellow);
    transform: translateX(-50%);
    transition: width .22s ease;
  }
  .nav a:hover::after, .nav a.active::after { width: 42%; }
  /* ===== 页面标题 ===== */
  .page-head {
    text-align: center;
    padding: clamp(36px, 6vw, 64px) clamp(16px, 4vw, 40px) 8px;
  }
  .page-head .eyebrow {
    display: inline-block;
    margin: 0 0 12px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--red);
  }
  .page-head h1 {
    margin: 0;
    font-family: "Comic Neue", "Comic Sans MS", "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
    font-size: clamp(32px, 6vw, 52px);
    font-weight: 400;
    line-height: 1.2;
    color: var(--green-deep);
  }
  .page-head .lead {
    color: var(--ink-soft);
    font-size: clamp(16px, 2.5vw, 19px);
    margin: 18px auto 0;
    max-width: 620px;
  }
  .hl-green { color: var(--green-deep); font-weight: 700; }
  .hl-yellow {
    background: linear-gradient(transparent 60%, rgba(246,195,37,.55) 60%);
    font-weight: 700;
    padding: 0 2px;
  }
  .hl-red { color: var(--red); font-weight: 700; }
  /* ===== 数据卡片 ===== */
  .stats {
    max-width: 860px;
    margin: clamp(24px, 4vw, 40px) auto 0;
    padding: 0 clamp(16px, 4vw, 40px);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(14px, 2.5vw, 24px);
  }
  .stat {
    background: #fff;
    border-radius: 22px;
    border: 4px solid var(--line);
    box-shadow: var(--shadow);
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    padding: 12px;
  }
  .stat .num {
    font-family: "Comic Neue", "Comic Sans MS", "ZCOOL KuaiLe", sans-serif;
    font-size: clamp(36px, 7vw, 60px);
    line-height: 1;
  }
  .stat:nth-child(1) .num { color: var(--green-deep); }
  .stat:nth-child(2) .num { color: var(--yellow); text-shadow: 0 1px 0 rgba(0,0,0,.08); }
  .stat:nth-child(3) .num { color: var(--red); }
  .stat .label {
    font-size: 13px;
    color: var(--ink-soft);
  }
  /* ===== 弹幕区 ===== */
  .bili-title {
    max-width: 860px;
    margin: clamp(36px, 5vw, 56px) auto 0;
    padding: 0 clamp(16px, 4vw, 40px);
    text-align: center;
    font-size: clamp(18px, 3vw, 22px);
    color: var(--ink);
  }
  .danmu {
    position: relative;
    max-width: 860px;
    height: 300px;
    margin: 18px auto 0;
    padding: 0 clamp(16px, 4vw, 40px);
    overflow: hidden;
  }
  .chip {
    position: absolute;
    display: inline-block;
    animation: drift 6s ease-in-out infinite alternate;
    filter: drop-shadow(0 4px 6px rgba(42,38,34,.18));
    transition: transform .15s ease;
  }
  .chip:hover { transform: scale(1.15); }
  .chip img { display: block; height: 44px; width: auto; }
  @keyframes drift {
    0%   { transform: translate(0, 0) rotate(-2deg); }
    50%  { transform: translate(14px, -12px) rotate(2deg); }
    100% { transform: translate(-10px, 10px) rotate(-1deg); }
  }
  /* 各公司标签配色 */
  .c-gamejolt  { background: #e12d39; }
  .c-wechat     { background: #22a844; }
  .c-qq         { background: #12b7f5; }
  .c-netease    { background: #e60012; }
  .c-tencent    { background: #0052d9; }
  .c-baidu      { background: #306eff; }
  .c-alibaba    { background: #ff6a00; }
  .c-gamebanana { background: #f59e0b; }
  .c-bilibili   { background: #fb7299; }
  .c-itchio     { background: #fa5c5c; }
  .c-youtube    { background: #ff0000; }
  .c-github     { background: #24292e; }
  .c-steam      { background: #1b2838; }
  /* 每个标签的位置 + 动画节奏 */
  .p1  { top: 6%;  left: 4%;  animation-duration: 5s; }
  .p2  { top: 18%; left: 32%; animation-duration: 7s; animation-delay: -1s; }
  .p3  { top: 4%;  left: 62%; animation-duration: 6s; animation-delay: -2s; }
  .p4  { top: 32%; left: 12%; animation-duration: 8s; animation-delay: -3s; }
  .p5  { top: 44%; left: 44%; animation-duration: 5.5s; animation-delay: -.5s; }
  .p6  { top: 30%; left: 74%; animation-duration: 6.5s; animation-delay: -2.5s; }
  .p7  { top: 60%; left: 24%; animation-duration: 7.5s; animation-delay: -4s; }
  .p8  { top: 68%; left: 56%; animation-duration: 6s; animation-delay: -1.5s; }
  .p9  { top: 56%; left: 82%; animation-duration: 8.5s; animation-delay: -3.5s; }
  .p10 { top: 80%; left: 8%;  animation-duration: 5.8s; animation-delay: -2s; }
  .p11 { top: 86%; left: 38%; animation-duration: 7.2s; animation-delay: -4.5s; }
  .p12 { top: 78%; left: 68%; animation-duration: 6.8s; animation-delay: -1s; }
  .p13 { top: 50%; left: 2%;  animation-duration: 7.8s; animation-delay: -3s; }
  /* ===== 致谢 + 社交链接 ===== */
  .thanks {
    max-width: 860px;
    margin: clamp(36px, 5vw, 56px) auto 0;
    padding: 0 clamp(16px, 4vw, 40px);
    text-align: center;
    font-size: clamp(18px, 3vw, 22px);
  }
  .socials {
    max-width: 860px;
    margin: 22px auto clamp(30px, 5vw, 50px);
    padding: 0 clamp(16px, 4vw, 40px);
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .social {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #fff;
    border: 3px solid var(--line);
    border-radius: 16px;
    padding: 14px 18px;
    text-decoration: none;
    font-weight: 700;
    color: var(--ink);
    transition: transform .15s ease, border-color .15s ease;
  }
  .social:hover { transform: translateY(-2px); }
  .social .arrow { color: var(--ink-soft); font-weight: 400; }
  .social.bili    { border-color: #fb7299; }
  .social.bili:hover    { background: #fff0f4; }
  .social.codemao { border-color: var(--red); }
  .social.codemao:hover { background: #fff0f0; }
  .social.gb      { border-color: #f59e0b; }
  .social.gb:hover      { background: #fff7e6; }
  .social.gh      { border-color: #24292e; }
  .social.gh:hover      { background: #f3f4f6; }
  /* ===== 页脚（黑板，与游戏库一致） ===== */
  footer {
    margin-top: 40px;
    background: var(--board);
    color: #f3efe3;
    text-align: center;
    padding: clamp(30px, 5vw, 52px) 20px;
    border-radius: 28px 28px 0 0;
  }
  footer .chalk {
    font-family: "Comic Neue", "Comic Sans MS", "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
    font-size: clamp(22px, 4vw, 30px);
    margin: 0 0 8px;
    color: #fff;
  }
  footer p { margin: 0; font-size: 14px; color: rgba(243, 239, 227, .8); }
  @media (max-width: 640px) {
    .brand { font-size: 18px; }
    .brand .star { width: 26px; height: 26px; }
    .nav a { padding: 8px 10px; font-size: 15px; }
    .stats { gap: 10px; }
    .stat { border-width: 3px; border-radius: 16px; }
    .danmu { height: 360px; }
    .socials { grid-template-columns: 1fr; }
  }
</style>

<body>
  <!-- ===== 顶部导航条（与游戏库一致） ===== -->

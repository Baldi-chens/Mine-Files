<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>其他的杂项 - Baldi-chens</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=Comic+Neue:wght@400;700&display=swap">
<style>
  /* ===== 设计令牌（与主页一致） ===== */
  :root {
    --paper: #fbf7ee;
    --ink: #2a2622;
    --ink-soft: #5c564e;
    --green: #2f7d4d;
    --green-deep: #225c38;
    --yellow: #f6c325;
    --red: #e5484d;
    --board: #23413a;
    --line: #e4dbc8;
    --shadow: 0 10px 30px rgba(42, 38, 34, .14);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Comic Neue", "Comic Sans MS", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 8%, rgba(246, 195, 37, .12), transparent 26%),
      radial-gradient(circle at 88% 20%, rgba(61, 127, 191, .10), transparent 28%),
      var(--paper);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  /* ===== 顶部导航条（与主页一致） ===== */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px clamp(16px, 4vw, 40px);
    background: rgba(251, 247, 238, .92);
    backdrop-filter: blur(8px);
    border-bottom: 2px solid var(--line);
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    font-family: "Comic Neue", "Comic Sans MS", "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
    font-size: 22px;
    letter-spacing: .5px;
    color: var(--green-deep);
    padding: 6px 0;
  }
  .brand .star { width: 30px; height: 30px; flex: none; }
  .nav { display: flex; align-items: center; gap: 4px; }
  .nav a {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 8px 16px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
    border-radius: 12px;
    transition: background .2s ease, color .2s ease;
  }
  .nav a:hover { background: rgba(47, 125, 77, .10); color: var(--green-deep); }
  .nav a.active { background: rgba(47, 125, 77, .10); color: var(--green-deep); }
  .nav a::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 6px;
    width: 0;
    height: 3px;
    border-radius: 3px;
    background: var(--yellow);
    transform: translateX(-50%);
    transition: width .22s ease;
  }
  .nav a:hover::after, .nav a.active::after { width: 42%; }
  /* ===== 页面标题 ===== */
  .page-head {
    text-align: center;
    padding: clamp(36px, 6vw, 64px) clamp(16px, 4vw, 40px) 16px;
  }
  .page-head .eyebrow {
    display: inline-block;
    margin: 0 0 12px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--red);
  }
  .page-head h1 {
    margin: 0;
    font-family: "Comic Neue", "Comic Sans MS", "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
    font-size: clamp(30px, 6vw, 48px);
    font-weight: 400;
    line-height: 1.2;
    color: var(--green-deep);
  }
  .page-head p { color: var(--ink-soft); font-size: 16px; margin: 10px auto 0; max-width: 620px; }
  .hl-yellow {
    background: linear-gradient(transparent 60%, rgba(246,195,37,.55) 60%);
    font-weight: 700;
    padding: 0 2px;
  }
  /* ===== 条目卡片 ===== */
  .items {
    max-width: 860px;
    margin: 0 auto;
    padding: clamp(20px, 4vw, 40px) clamp(16px, 4vw, 40px) clamp(30px, 5vw, 60px);
    display: grid;
    gap: 24px;
  }
  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: #fff;
    border-radius: 22px;
    padding: clamp(18px, 3vw, 28px) clamp(20px, 3vw, 30px);
    box-shadow: var(--shadow);
    border: 4px solid var(--line);
    flex-wrap: wrap;
  }
  .item.yellow { border-color: var(--yellow); }
  .item.purple { border-color: #8b5ecb; }
  .item.red { border-color: var(--red); }
  .item-info { min-width: 0; flex: 1 1 300px; }
  .item-info h3 {
    margin: 0 0 8px;
    font-family: "Comic Neue", "Comic Sans MS", "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
    font-size: clamp(18px, 3vw, 24px);
    font-weight: 400;
    line-height: 1.3;
    color: var(--ink);
  }
  .item-info p {
    margin: 0;
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.6;
  }
  .item-actions {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    flex: 0 0 auto;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 22px;
    border-radius: 14px;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    white-space: nowrap;
    transition: transform .15s ease, filter .15s ease;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .btn.play-yellow { background: #e0a800; }
  .btn.dl-purple { background: #7b3fd6; }
  .btn.dl-red { background: #c93a3f; }
  /* ===== 页脚（黑板，与主页一致） ===== */
  footer {
    margin-top: 40px;
    background: var(--board);
    color: #f3efe3;
    text-align: center;
    padding: clamp(30px, 5vw, 52px) 20px;
    border-radius: 28px 28px 0 0;
  }
  footer .chalk {
    font-family: "Comic Neue", "Comic Sans MS", "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
    font-size: clamp(22px, 4vw, 30px);
    margin: 0 0 8px;
    color: #fff;
  }
  footer p { margin: 0; font-size: 14px; color: rgba(243, 239, 227, .8); }
  @media (max-width: 640px) {
    .brand { font-size: 18px; }
    .brand .star { width: 26px; height: 26px; }
    .nav a { padding: 8px 10px; font-size: 15px; }
    .item { flex-direction: column; align-items: flex-start; }
    .item-actions { width: 100%; }
    .btn { flex: 1; }
  }
</style>
